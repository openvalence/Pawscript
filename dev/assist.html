<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Assist harness</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font-family: var(--font); font-size: 13px; overflow: hidden; }
  #root { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: auto 1fr 120px 22px; height: 100vh; }
  #bar { grid-column: 1 / 3; display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line-1); background: var(--bg-raised); }
  #bar .mut { color: var(--tx-mut); }
  #video { background: var(--bg-sunken); min-height: 0; display: grid; place-items: center; }
  #video video { max-width: 100%; max-height: 100%; }
  #dock { grid-row: 2 / 4; grid-column: 2; border-left: 1px solid var(--line-1); min-height: 0; display: flex; flex-direction: column; }
  #dock .ttl { font-size: 11px; color: var(--tx-mut); padding: 4px 8px; background: var(--bg-raised); border-bottom: 1px solid var(--line-1); letter-spacing: .08em; text-transform: uppercase; }
  #panel { flex: 1; min-height: 0; }
  #strip { width: 100%; height: 100%; display: block; background: var(--bg-sunken); border-top: 1px solid var(--line-1); }
  #status { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--bg-raised); border-top: 1px solid var(--line-1); font-size: 11px; color: var(--tx-mut); }
  button.b { height: 22px; border: 1px solid var(--line-ctl); background: var(--bg-card); color: var(--tx); border-radius: 2px; font: inherit; cursor: pointer; }
</style></head>
<body><div id="root">
  <div id="bar"><b>Assist harness</b><span class="mut">synthetic 60 s clip: 6 scenes, the script is wrong in scene 2, scene 5 and the second half of scene 4 · F6 opens the overlay</span>
    <span style="flex:1"></span><button class="b" id="reset">Reset doc</button></div>
  <div id="video"><video id="v" muted playsinline></video></div>
  <div id="dock"><div class="ttl">Assist</div><div id="panel"></div></div>
  <canvas id="strip"></canvas>
  <div id="status"><span id="st"></span><span style="flex:1"></span><span id="chip"></span></div>
</div><div id="modal"></div>
<script type="module" src="./assist.js"></script></body></html>
