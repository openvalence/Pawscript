<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Tracking harness</title><link rel="icon" href="data:,">
<style>
  #root { display: grid; grid-template-rows: 30px minmax(0, 1fr) auto 24px; height: 100vh; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 0 10px; border-bottom: 1px solid var(--line-1); background: var(--bg-raised); font-size: 12px; }
  #bar b { font-weight: 500; color: var(--tx-hi); }
  #main { display: grid; grid-template-columns: var(--pw, 300px) minmax(0, 1fr); min-height: 0; }
  #dock { border-right: 1px solid var(--line-1); min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  #dock .head { height: 28px; flex: none; display: flex; align-items: center; padding: 0 12px; background: var(--bg-raised); border-bottom: 1px solid var(--line-1); }
  #panel { flex: 1; min-height: 0; position: relative; }
  #pane { position: relative; background: #000; min-height: 0; overflow: hidden; }
  #pane video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #overlay { position: absolute; inset: 0; }
  #stack { border-top: 1px solid var(--line-1); background: var(--bg-sunken); }
  .trow { display: grid; grid-template-columns: 76px minmax(0, 1fr); border-bottom: 1px solid var(--line-0); }
  .trow .g { background: var(--bg-raised); border-right: 1px solid var(--line-1); padding: 4px 6px 0 8px; }
  .trow .c { position: relative; min-width: 0; overflow: hidden; }
  #status { display: flex; gap: 12px; align-items: center; padding: 0 10px; font-size: 11px; color: var(--tx-mut); background: var(--bg-raised); border-top: 1px solid var(--line-1); }
  #status .busy { color: var(--reality); }
  #status .error { color: var(--bad); }
</style></head>
<body><div id="root">
  <div id="bar"><b>Tracking harness</b><span id="modes"></span><span style="flex:1"></span>
    <label class="k-hint"><input type="checkbox" id="fail"> fail next track</label>
    <label class="k-hint"><input type="checkbox" id="pan" onchange="H.FAKE.pan = this.checked"> camera pan</label>
    <button class="btn sm" id="play">Play</button>
    <button class="btn sm" id="undo">Undo</button>
  </div>
  <div id="main">
    <div id="dock"><div class="head k-caps">Tracking</div><div id="panel"></div></div>
    <div id="pane"><video id="vid" src="/dev/assets/cfr2997.mp4" preload="auto" muted></video><div id="overlay"></div></div>
  </div>
  <div id="stack">
    <div class="trow" style="height:120px"><div class="g k-caps">stroke</div><div class="c" id="lane-stroke"></div></div>
    <div class="trow" style="height:110px"><div class="g k-caps">Tracker</div><div class="c" id="lane-track"></div></div>
  </div>
  <div id="status"></div>
</div>
<script type="module" src="./tracking.js"></script></body></html>
