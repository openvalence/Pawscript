<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Simulator harness</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font-family: var(--font); font-size: 13px; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line-1); background: var(--bg-raised); flex-wrap: wrap; }
  #stage { position: relative; overflow: hidden; margin: 10px; width: var(--sw, 960px); height: var(--sh, 540px); background: #000; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #info { color: var(--tx-mut); font-family: var(--mono); font-size: 11px; }
</style></head>
<body>
  <div id="bar"><b>Simulator harness</b>
    <button class="btn sm" id="play">Play / pause</button>
    <button class="btn sm" id="show">Show sim</button>
    <select id="doc" style="width:auto"><option value="multi">stroke + roll/pitch/twist/surge</option><option value="sample">sample (stroke + roll)</option><option value="fast">fast / over limit</option><option value="empty">empty stroke</option></select>
    <select id="machine" style="width:auto"><option value="off">machine off</option><option value="fake">machine: fake ghost</option><option value="real">machine: real planner</option></select>
    <select id="theme" style="width:auto"><option value="dark">dark</option><option value="light">light</option><option value="contrast">contrast</option></select>
    <span id="info"></span></div>
  <div id="stage"><video src="./assets/cfr30.mp4" muted loop playsinline></video></div>
  <pre id="out" style="display:none"></pre>
  <script type="module" src="./video-sim.js"></script>
</body></html>
