<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Review harness</title><link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); }
  #root { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  #bar { display: flex; gap: var(--gap); align-items: center; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line-1); background: var(--bg-raised); flex-wrap: wrap; }
  #strip { width: 100%; height: 56px; display: block; background: var(--bg-sunken); }
  #cols { display: flex; gap: var(--space-5); padding: var(--space-5); overflow: auto; min-height: 0; }
  .col { flex: none; width: var(--pw, 360px); display: flex; flex-direction: column; border: 1px solid var(--line-1); background: var(--bg); min-height: 0; }
  .col > .ttl { flex: none; display: flex; align-items: center; height: var(--ctl-h); padding: 0 var(--space-4); font: 500 var(--fs-1) var(--font-head); color: var(--tx-val); background: var(--bg-raised); border-bottom: 1px solid var(--line-1); letter-spacing: var(--caps-track); text-transform: uppercase; }
  .col > .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .col > .body > :global(.rv), .col > .body > .rv { flex: 1; }
  #out { display: none; }
</style></head>
<body class="kit-root"><div id="root">
  <div id="bar"><b style="color:var(--tx-hi)">Review harness</b><span id="info" class="k-num" style="color:var(--tx-mut);font-size:var(--fs-2)"></span><span style="flex:1"></span><span id="tools" style="display:contents"></span></div>
  <canvas id="strip"></canvas>
  <div id="cols"></div>
</div><pre id="out"></pre>
<script type="module" src="./review.js"></script></body></html>
