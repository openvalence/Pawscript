<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Timeline harness</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #root { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr) 340px; height: 100vh; }
  #bar { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line-1); background: var(--bg-raised); font-size: 12px; color: var(--tx-mut); }
  #bar b { color: var(--tx-hi); font-weight: 500; }
  #bar .num { font-family: var(--mono); color: var(--tx-val); }
  #stack { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; background: var(--bg-sunken); }
  /* rows span the full width like the shell's Timeline (no gutter); the title is a quiet tag at the top right */
  .hrow { position: relative; flex: none; border-bottom: 1px solid var(--line-0); }
  .hrow.fill { flex: 1 1 auto; min-height: 140px; }
  .hrow > .hcontent { position: absolute; inset: 0; overflow: hidden; }
  .hrow > .htag { position: absolute; top: 2px; right: 4px; z-index: 3; pointer-events: none; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--tx-ghost); }
  #side { border-left: 1px solid var(--line-1); overflow: auto; min-height: 0; background: var(--bg); }
  .pnl > .ttl { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--tx-mut); padding: 4px 8px; background: var(--bg-raised); border-bottom: 1px solid var(--line-1); }
  .pnl > .body { padding: 8px; }
  #out { display: none; }
  button.h { background: var(--bg-card); color: var(--tx); border: 1px solid var(--line-2); border-radius: 2px; padding: 2px 8px; cursor: pointer; font: inherit; }
</style></head>
<body><div id="root">
  <div id="bar"><b>Timeline harness</b><span class="num" id="info"></span><span style="flex:1"></span>
    <button class="h" id="play">Play</button><button class="h" id="undo">Undo</button><button class="h" id="redo">Redo</button>
    <a class="h" href="?big=1" style="color:inherit">100k doc</a><a class="h" href="?" style="color:inherit">10 min doc</a><a class="h" href="?stack=shell" style="color:inherit">shell stack</a></div>
  <div id="stack"></div>
  <div id="side"></div>
</div><pre id="out"></pre>
<script type="module" src="./timeline.js"></script></body></html>
